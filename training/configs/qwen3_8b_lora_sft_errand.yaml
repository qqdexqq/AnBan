# LLaMA-Factory LoRA SFT: AnBan ERRAND agent (online shopping, docs/ERRAND_AGENT.md) on Qwen3-8B.
# Separate adapter from the r3 banking planner; never point output_dir at an r3 folder.
# Same recipe as r3 (rank 32 / alpha 64, qwen3 template + enable_thinking false, bf16, cosine).
# Multi-turn sharegpt rows: every assistant turn (one JSON action) is trained, observations are masked.
# Launch through scripts/train_errand.sh (it checks the data and refuses an existing run dir).

### model
model_name_or_path: /path/to/Qwen3-8B   # overridden by the script
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### dataset
dataset_dir: training/data_errand        # overridden by the script
dataset: errand_train
eval_dataset: errand_dev
template: qwen3
enable_thinking: false
cutoff_len: 4096          # trajectories are ~1-2k tokens; the builder reports the max
overwrite_cache: false
preprocessing_num_workers: 8

### output
output_dir: outputs/anban-errand-r1      # overridden by the script
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
